name: Format Project Provider Policy Once
on:
  push:
    branches: [feature/project-seo-provider-settings]
    paths: [.github/workflows/format-project-policy-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-seo-provider-settings
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/server/custom/providers/projectPreference.ts src/server/custom/providers/projectPreference.test.ts src/client/features/integrations/SeoDataProviderSettings.tsx
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add src/server/custom/providers src/client/features/integrations/SeoDataProviderSettings.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format project provider policy and UI"
            git push
          fi
