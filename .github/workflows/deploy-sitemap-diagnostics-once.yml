name: Deploy Sitemap Diagnostics Once
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-sitemap-diagnostics-once.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authorized Cloudflare deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run selfhost-cloudflare-manual.yml --repo "$GH_REPO" --ref main -f operation=deploy -f confirm_deploy=DEPLOY
