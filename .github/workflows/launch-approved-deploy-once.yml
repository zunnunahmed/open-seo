name: Launch Approved OpenSEO Production Deployment Once

# This workflow dispatches the existing manually guarded deployment one time.
on:
  push:
    branches: [main]
    paths: [.github/workflows/launch-approved-deploy-once.yml]

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch approved self-host deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run selfhost-cloudflare-manual.yml --repo "$GH_REPO" --ref main -f operation=deploy -f confirm_deploy=DEPLOY
          echo "Dispatched OpenSEO Cloudflare deployment (operation=deploy)."
