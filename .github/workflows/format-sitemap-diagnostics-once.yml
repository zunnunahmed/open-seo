name: Format Sitemap Diagnostics Once
on:
  push:
    branches: [fix/sitemap-zero-diagnostics]
    paths: [.github/workflows/format-sitemap-diagnostics-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sitemap-zero-diagnostics
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/server/custom/sitemaps/crawler.ts src/client/features/projects/SitemapSettings.tsx
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add src/server/custom/sitemaps/crawler.ts src/client/features/projects/SitemapSettings.tsx
          if ! git diff --cached --quiet; then git commit -m "Format sitemap scanner error fixes"; git push; fi
