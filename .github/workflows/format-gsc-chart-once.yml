name: Format GSC Category Chart Once
on:
  push:
    branches: [feature/gsc-category-chart-export]
    paths: [.github/workflows/format-gsc-chart-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gsc-category-chart-export
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/client/features/search-performance/GscCategoryChart.tsx src/client/features/search-performance/SearchPerformancePage.tsx
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add src/client/features/search-performance
          if ! git diff --cached --quiet; then git commit -m "Format GSC category chart"; git push; fi
