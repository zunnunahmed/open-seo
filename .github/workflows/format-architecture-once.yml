name: Format Architecture Document
on:
  push:
    branches: [feature/gsc-url-categories]
    paths: [.github/workflows/format-architecture-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gsc-url-categories
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/CUSTOM_UPDATE_SAFE_ARCHITECTURE.md
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/CUSTOM_UPDATE_SAFE_ARCHITECTURE.md
          if ! git diff --cached --quiet; then
            git commit -m "Format existing architecture documentation"
            git push
          fi
