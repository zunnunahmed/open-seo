name: OpenSEO Cloudflare Self-Host (Manual)

# Preparation only. No deployment on push, pull request or schedule.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate, bootstrap Alchemy state store, or deploy OpenSEO"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - bootstrap
          - deploy
      confirm_deploy:
        description: "Type BOOTSTRAP or DEPLOY to authorize Cloudflare changes"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: openseo-cloudflare-selfhost
  cancel-in-progress: false

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository self-host deployment configuration
        run: |
          test -f deploy/.env.selfhost.example
          node -e "const p=require('./package.json');if(!p.scripts['deploy:selfhost'])process.exit(1)"
          echo 'OpenSEO self-host script found. No Cloudflare changes made.'
      - name: Require confirmation for Alchemy bootstrap
        if: ${{ inputs.operation == 'bootstrap' }}
        env:
          CONFIRM: ${{ inputs.confirm_deploy }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$CONFIRM" != "BOOTSTRAP" ]; then echo "::error::Type BOOTSTRAP to authorize state-store creation"; exit 1; fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "::error::Missing Cloudflare token or account ID"; exit 1; fi
          echo 'Bootstrap is a Cloudflare-changing operation. Requires Workers, Secrets Store and account permissions.'
      - name: Bootstrap Alchemy Cloudflare state store
        if: ${{ inputs.operation == 'bootstrap' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm alchemy cloudflare bootstrap
      - name: Check explicit permission and required secrets
        if: ${{ inputs.operation == 'deploy' }}
        env:
          CONFIRM: ${{ inputs.confirm_deploy }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DFS_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
          GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TREG_TOKEN: ${{ secrets.TREG_API_TOKEN }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then echo "::error::Enter DEPLOY to authorize a deployment"; exit 1; fi
          for name in CF_TOKEN CF_ACCOUNT DFS_KEY ALLOWED_EMAILS; do
            if [ -z "${!name}" ]; then echo "::error::Missing required secret: $name"; exit 1; fi
          done
          if [ -n "$GOOGLE_ID" ] || [ -n "$GOOGLE_SECRET" ] || [ -n "$AUTH_SECRET" ]; then
            for name in GOOGLE_ID GOOGLE_SECRET AUTH_SECRET; do
              if [ -z "${!name}" ]; then echo "::error::Google OAuth requires all three secrets ($name missing)"; exit 1; fi
            done
            if [ "${#AUTH_SECRET}" -lt 32 ]; then echo "::error::BETTER_AUTH_SECRET must be at least 32 characters"; exit 1; fi
          fi
          echo 'Required secrets provided. Bootstrap must have completed successfully before deploy.'
      - name: Create private self-host environment file
        if: ${{ inputs.operation == 'deploy' }}
        env:
          DFS_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
          GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          values = {'DATAFORSEO_API_KEY': os.environ['DFS_KEY'],
                    'ACCESS_ALLOWED_EMAILS': os.environ['ALLOWED_EMAILS']}
          if os.environ.get('TREG_TOKEN'):
              values['TREG_API_TOKEN'] = os.environ['TREG_TOKEN']
              values['CUSTOM_TREG_ENABLED'] = 'true'
          if os.environ.get('GOOGLE_ID'):
              values.update(GOOGLE_CLIENT_ID=os.environ['GOOGLE_ID'], GOOGLE_CLIENT_SECRET=os.environ['GOOGLE_SECRET'], BETTER_AUTH_SECRET=os.environ['AUTH_SECRET'])
          if any(('\n' in v or '\r' in v) for v in values.values()):
              raise SystemExit('Unexpected newline in secret')
          Path('.env.selfhost').write_text(''.join(f'{k}={v}\n' for k,v in values.items()))
          Path('.env.selfhost').chmod(0o600)
          PY
      - name: Deploy through the official Alchemy self-host script
        if: ${{ inputs.operation == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:selfhost --yes
      - name: Remove temporary environment file
        if: ${{ always() }}
        run: rm -f .env.selfhost
