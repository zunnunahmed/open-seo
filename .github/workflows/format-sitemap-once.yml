name: Format Sitemap Feature Once
on:
  push:
    branches: [feature/monthly-sitemap-monitoring]
    paths: [.github/workflows/format-sitemap-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monthly-sitemap-monitoring
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/server/custom/sitemaps/crawler.ts src/serverFunctions/sitemapMonitor.ts src/client/features/projects/SitemapSettings.tsx src/client/features/projects/ProjectGeneralSettings.tsx src/client/features/dashboard/DashboardSitemapMonitor.tsx src/client/features/dashboard/DashboardPage.tsx src/server.ts wrangler.jsonc
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add src/server/custom/sitemaps src/serverFunctions/sitemapMonitor.ts src/client/features/projects src/client/features/dashboard src/server.ts wrangler.jsonc
          if ! git diff --cached --quiet; then git commit -m "Format monthly sitemap monitoring"; git push; fi
