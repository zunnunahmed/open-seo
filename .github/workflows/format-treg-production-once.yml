name: Format treg Production Integration Once
on:
  push:
    branches: [feature/treg-production-provider-router]
    paths: [.github/workflows/format-treg-production-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/treg-production-provider-router
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/server/custom/providers/treg/client.ts src/server/custom/providers/treg/client.test.ts src/serverFunctions/tregBacklinks.ts src/client/features/backlinks/TregBacklinksSummaryCard.tsx src/client/features/backlinks/BacklinksPage.tsx src/client/features/backlinks/useBacklinksPageData.ts
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add src/server/custom/providers/treg src/serverFunctions/tregBacklinks.ts src/client/features/backlinks
          if ! git diff --cached --quiet; then
            git commit -m "Format treg production integration"
            git push
          fi
