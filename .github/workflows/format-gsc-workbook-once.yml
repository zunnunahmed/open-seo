name: Format GSC Workbook Once
on:
  push:
    branches: [feature/gsc-category-workbook]
    paths: [.github/workflows/format-gsc-workbook-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gsc-category-workbook
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/client/features/search-performance/categoryWorkbook.ts src/client/features/search-performance/GscCategoryChart.tsx
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add src/client/features/search-performance
          if ! git diff --cached --quiet; then git commit -m "Format GSC category workbook"; git push; fi
